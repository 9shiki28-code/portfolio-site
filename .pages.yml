# Pages CMS の設定ファイル（https://pagescms.org/docs/）
# pagescms.org に GitHub でログインすると、この設定に沿った編集画面が表示されます。

media:
  - name: blog
    label: ブログ用画像
    input: src/assets/blog
    output: ../../assets/blog
    extensions: [jpg, jpeg, png, webp, avif, gif]
  - name: works
    label: 実績用画像
    input: src/assets/works
    output: ../../assets/works
    extensions: [jpg, jpeg, png, webp, avif, gif]
  - name: profile
    label: プロフィール用画像
    input: src/assets/profile
    output: /src/assets/profile
    extensions: [jpg, jpeg, png, webp, avif]

content:
  # ---------------- ブログ ----------------
  - name: blog
    label: ブログ記事
    type: collection
    path: src/content/blog
    filename: "{fields.slug}.md"
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: URL名（英小文字・数字・ハイフン）
        description: "記事のURLになります。例: kitchen-interview → /blog/kitchen-interview/ 。公開後は変えないでください。"
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9][a-z0-9-]*$"
          message: 英小文字・数字・ハイフンだけで入力してください
      - name: description
        label: 説明文
        description: 一覧や検索結果に表示されます（80〜120字程度）
        type: text
        required: true
      - name: pubDate
        label: 公開日
        type: date
        required: true
      - name: updatedDate
        label: 更新日（任意）
        type: date
      - name: tags
        label: タグ
        description: 1つずつ追加してください
        type: string
        list: true
      - name: cover
        label: アイキャッチ画像（任意）
        type: image
        options:
          media: blog
      - name: coverAlt
        label: 画像の説明（任意）
        type: string
      - name: draft
        label: 下書き（オンの間はサイトに公開されません）
        type: boolean
        default: true
      - name: body
        label: 本文
        type: rich-text
        options:
          media: blog

  # ---------------- 実績 ----------------
  - name: works
    label: 実績
    type: collection
    path: src/content/works
    filename: "{fields.slug}.md"
    view:
      fields: [title, media, date, featured]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: URL名（英小文字・数字・ハイフン）
        description: "詳細ページのURLになります。例: house-in-hayama"
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9][a-z0-9-]*$"
          message: 英小文字・数字・ハイフンだけで入力してください
      - name: media
        label: 掲載媒体・クライアント
        type: string
        required: true
      - name: type
        label: 種類
        type: select
        required: true
        options:
          values: [取材記事, 企業広報, SEO記事, コラム, 監修・編集, インタビュー]
      - name: date
        label: 掲載日
        type: date
        required: true
      - name: summary
        label: 概要
        description: 一覧に表示されます（60〜100字程度）
        type: text
        required: true
      - name: url
        label: 掲載先URL（任意）
        description: 本文が空のときは、一覧からこのURLへ直接リンクします
        type: string
      - name: tags
        label: 分野タグ
        type: string
        list: true
      - name: cover
        label: サムネイル画像（任意）
        type: image
        options:
          media: works
      - name: coverAlt
        label: 画像の説明（任意）
        type: string
      - name: featured
        label: トップページに表示する
        type: boolean
        default: false
      - name: draft
        label: 下書き（オンの間はサイトに公開されません）
        type: boolean
        default: false
      - name: body
        label: 詳細ページの本文（任意）
        description: 書くとサイト内に詳細ページができます。空なら掲載先URLへリンクします
        type: rich-text
        options:
          media: works

  # ---------------- サイトのページ ----------------
  - name: home
    label: トップページ
    type: file
    path: src/data/home.json
    fields:
      - name: eyebrow
        label: キャッチコピー上の小見出し（英字）
        type: string
      - name: heroTitle
        label: キャッチコピー
        type: string
        required: true
      - name: heroLead
        label: キャッチコピー下の紹介文
        type: text
      - name: primaryButton
        label: ボタン1の文字（実績ページへ）
        type: string
      - name: secondaryButton
        label: ボタン2の文字（お問い合わせへ）
        type: string
      - name: profileText
        label: ページ下部「Profile」欄の紹介文
        type: text

  - name: about
    label: プロフィール
    type: file
    path: src/data/about.json
    fields:
      - name: portrait
        label: プロフィール写真
        description: 縦長の写真がおすすめです。トップページの丸い写真にも使われます
        type: image
        options:
          media: profile
      - name: intro
        label: 自己紹介文（段落ごと）
        description: 1つの欄が1段落になります
        type: text
        list: true
      - name: fields
        label: 対応できる仕事
        type: object
        list: true
        fields:
          - name: title
            label: 見出し
            type: string
            required: true
          - name: text
            label: 説明
            type: text
      - name: career
        label: 経歴
        type: object
        list: true
        fields:
          - name: year
            label: 年・時期
            type: string
          - name: text
            label: 内容
            type: text
      - name: qualifications
        label: 資格・専門分野
        type: string
        list: true

  - name: pages
    label: ページの紹介文
    type: file
    path: src/data/pages.json
    fields:
      - name: works
        label: 実績ページ
        type: object
        fields:
          - name: lead
            label: 紹介文
            type: text
          - name: description
            label: 検索結果に表示される説明文
            type: text
      - name: blog
        label: ブログ一覧ページ
        type: object
        fields:
          - name: lead
            label: 紹介文
            type: text
          - name: description
            label: 検索結果に表示される説明文
            type: text
      - name: contact
        label: お問い合わせページ
        type: object
        fields:
          - name: lead
            label: 紹介文
            type: text
          - name: description
            label: 検索結果に表示される説明文
            type: text

  - name: site
    label: 基本情報
    type: file
    path: src/data/site.json
    fields:
      - name: name
        label: 名前
        type: string
        required: true
      - name: nameEn
        label: 名前（英字）
        type: string
      - name: role
        label: 肩書き
        type: string
      - name: location
        label: 所在地
        type: string
      - name: title
        label: サイト名（ブラウザのタブや検索結果に表示）
        type: string
        required: true
      - name: description
        label: サイトの説明文（トップページの検索結果に表示）
        type: text
        required: true
      - name: links
        label: SNS・外部リンク
        description: フッターとお問い合わせページに表示されます
        type: object
        list: true
        fields:
          - name: label
            label: 表示名（例：note、X）
            type: string
            required: true
          - name: href
            label: URL
            type: string
            required: true
      - name: contactTopics
        label: お問い合わせフォームの「ご用件」の選択肢
        type: string
        list: true
